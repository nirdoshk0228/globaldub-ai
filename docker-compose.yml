# Full stack locally: docker compose up --build   ->  API on :8000  (run the website with `npm run dev` in frontend/)
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: gd, POSTGRES_PASSWORD: gd, POSTGRES_DB: globaldub}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [backend/.env]
    environment: &infra
      DATABASE_URL: postgresql://gd:gd@db:5432/globaldub
      REDIS_URL: redis://redis:6379/0
      GD_STORAGE_DIR: /srv/storage
      GD_WORK_DIR: /srv/work
      PUBLIC_API_URL: http://localhost:8000
    volumes: [storage:/srv/storage]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python worker/run.py
    env_file: [backend/.env]
    environment: *infra
    volumes: [storage:/srv/storage]
    depends_on: [db, redis]
volumes: {pgdata: {}, storage: {}}
