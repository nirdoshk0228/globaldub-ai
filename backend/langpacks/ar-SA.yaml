register_guide: |
  Simple Modern Standard Arabic as used in pan-Arab dubbed drama, understood across the Gulf.
  Verbs and second-person pronouns must agree with the gender of the person addressed (أنتَ / أنتِ):
  check who is being spoken to. Kinship: mother -> أمي / يا أمي, elder brother -> his name or أخي.
  Money: convert lakh/crore into millions of rupees (مليون روبية).
cultural_notes: |
  Keep family-honour drama (الشرف، الكرامة) - it resonates strongly. Soften any reference to alcohol
  or explicit romance. "हे भगवान" -> يا إلهي.
