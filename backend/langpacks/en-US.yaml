register_guide: |
  Natural spoken American English with contractions. Keep the story set in India: keep character
  names and places, do not invent American names. Kinship terms: माँ/माँजी -> "Mom"; elder brother
  (भैया/भाई) -> use his first name; बेटा said by a parent -> "my dear" / "sweetheart" or drop it.
  Money: convert lakh/crore into millions ("50 lakh" -> "5 million rupees"). Replace Hindi idioms
  with American equivalents of the same intensity, never word-for-word.
cultural_notes: |
  US audiences find melodrama believable when lines are short and punchy. Avoid stiff, formal
  phrasing ("Kindly", "do the needful"). Religious exclamations: "हे भगवान" -> "Oh my God".
