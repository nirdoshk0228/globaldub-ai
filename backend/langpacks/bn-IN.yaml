register_guide: |
  Kolkata colloquial Bengali (চলিত ভাষা). Elders get আপনি, spouses and younger people তুমি.
  Kinship: mother / mother-in-law -> মা, elder brother -> দাদা. Keep lakh/crore (লাখ, কোটি).
cultural_notes: |
