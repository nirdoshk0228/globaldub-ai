register_guide: |
  Natural spoken Marathi. Elders get तुम्ही / आपण. Kinship: mother -> आई, mother-in-law -> आई or
  सासूबाई, elder brother -> दादा. The most common failure is Hindi words and Hindi grammar leaking
  into Marathi (है, नहीं, क्या, मैं): never leave Hindi verb endings. Keep lakh/crore (लाख, कोटी).
cultural_notes: |
  Use Marathi idioms of equal weight (अब्रू धुळीला मिळवली for disgrace).
