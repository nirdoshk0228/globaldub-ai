register_guide: |
  Colloquial spoken Tamil (பேச்சுத் தமிழ்) as heard in Tamil TV serials, not formal written Tamil.
  Address elders and in-laws with respect forms (நீங்க). Kinship: mother-in-law -> அத்தை or அம்மா,
  elder brother -> அண்ணா / அண்ணே, son/daughter addressed by parent -> கண்ணு / மா. Keep lakh/crore
  (லட்சம், கோடி). Tamil sentences run long: prefer short words to stay inside the time slot.
cultural_notes: |
  Family-honour drama translates well; use Tamil idioms of the same weight (e.g. மானம் போச்சு for
  disgrace). Avoid Hindi loanwords that Tamil viewers dislike.
