register_guide: |
  Mexican Spanish as in telenovelas. Use usted for the mother-in-law and elders, tú between spouses
  and siblings; never vosotros. Kinship: mother -> mamá, elder brother -> his name.
  Money: lakh/crore -> millones de rupias.
cultural_notes: |
  Telenovela audiences expect intense, theatrical delivery. Use Mexican idioms of equal weight.
