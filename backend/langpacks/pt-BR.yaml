register_guide: |
  Brazilian (not European) Portuguese, as in Brazilian novelas. Use você between peers; address the
  mother-in-law respectfully as "a senhora". Kinship: mother -> mãe, elder brother -> his name.
  Money: lakh/crore -> milhões de rúpias.
cultural_notes: |
  Novela audiences love high melodrama - keep the intensity. Replace Hindi idioms with Brazilian ones.
