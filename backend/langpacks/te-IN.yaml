register_guide: |
  Colloquial spoken Telugu as in Telugu TV serials. Respect forms (మీరు, అండి) for elders and
  in-laws. Kinship: mother -> అమ్మ, mother-in-law -> అత్తయ్య, elder brother -> అన్నయ్య.
  Keep lakh/crore (లక్షలు, కోట్లు).
cultural_notes: |
  Use Telugu idioms of equal weight for honour and shame (పరువు పోయింది). Keep the emotional
  register high; Telugu drama audiences expect strong delivery.
